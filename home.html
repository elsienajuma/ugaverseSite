<!DOCTYPE html>
<html>
<head>
    <title>Ugaverse Studios | Home</title>
    <link href="css/style.css" rel="stylesheet">
    <style>
        .view360-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        .view360-wrapper canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .view360-controls-inline {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .view360-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .view360-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: #FFD700;
        }

        .view360-btn svg {
            width: 18px;
            height: 18px;
        }

        .view360-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
        }

        .view360-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.2);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: view360-spin 1s linear infinite;
        }

        @keyframes view360-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ugaverse</div>
    </header>
        <section id="hero">
            <div class="left-container">
                <div class="text-container">
                    <h1>Welcome.</h1>
                    <p class="hero-sub">Discover Uganda’s hidden<br>treasures <span class="underline">in one click.</span></p>
                    <button class="cta-button" type="button">TAKE THE TOUR</button>
                </div>
            </div>
            <div class="right-container">
                <div class="video-container">
                    <div class="view360-wrapper" id="view360-wrapper">
                        <canvas id="view360-canvas"></canvas>
                        <div class="view360-loading" id="view360-loading">
                            <div class="view360-spinner"></div>
                        </div>
                        <div class="view360-controls-inline">
                            <button class="view360-btn" id="view360-reset" title="Reset view">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/>
                                </svg>
                            </button>
                            <button class="view360-btn" id="view360-fullscreen" title="Fullscreen">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="player-caption">Touch and drag the video to look around</div>
            </div>
        </section>
        <footer>...</footer>
  

   
</body>
<!-- View360 Library from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@egjs/view360@next/dist/view360.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const canvas = document.getElementById('view360-canvas');
        const loading = document.getElementById('view360-loading');
        const btnReset = document.getElementById('view360-reset');
        const btnFullscreen = document.getElementById('view360-fullscreen');
        const wrapper = document.getElementById('view360-wrapper');

        try {
            // Initialize View360 with your video
            const viewer = new View360.View360({
                canvas: canvas,
                autoplay: true,
                projection: new View360.equirectangular.EquirectangularProjection(),
                video: {
                    src: 'videos/1-Lobby.mp4',
                    type: 'video/mp4'
                },
                initialYaw: -90,
                initialPitch: 0,
                initialFov: 65,
                touchPanScale: 2,
                wheelScale: 0.5,
            });

            // Hide loading when ready
            viewer.on('ready', () => {
                loading.style.display = 'none';
                console.log('✅ View360 viewer ready');
            });

            // Reset view button
            btnReset.addEventListener('click', () => {
                viewer.set({
                    yaw: -90,
                    pitch: 0,
                    fov: 65
                });
            });

            // Fullscreen button
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    wrapper.requestFullscreen().catch(err => {
                        console.error('Fullscreen error:', err);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            // Handle visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    viewer.pause();
                } else {
                    viewer.play();
                }
            });

        } catch (error) {
            console.error('View360 initialization failed:', error);
            loading.innerHTML = '<div style="color: #FFD700; font-size: 14px; padding: 20px;">Failed to load player</div>';
        }
    });
</script>
</html>
