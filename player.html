<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ugaverse - 360° Video Player</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    .scene-container { 
      width: 100%; 
      height: 100%; 
      border-radius: 12px; 
      overflow: hidden; 
      position: relative;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .control-btn {
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .control-btn:hover {
      background: rgba(0,0,0,0.8);
    }
    .control-btn.muted {
      background: rgba(255,0,0,0.5);
    }
    .control-btn.muted:hover {
      background: rgba(255,0,0,0.8);
    }
    .control-btn svg {
      width: 24px;
      height: 24px;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="scene-container">
    <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false">
      <a-assets>
        <video id="video" src="../videos/WebDemo.mp4" preload="auto" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>
      <a-videosphere src="#video" rotation="0 -90 0"></a-videosphere>
      <a-camera look-controls="reverseMouseDrag: true" mouse-cursor></a-camera>
    </a-scene>
    <div class="controls">
      <button class="control-btn" id="sound-toggle" title="Toggle sound">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path id="sound-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          <path id="mute-x" d="M14.89 9.55l-1.44 1.44 1.44 1.44" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display: none"/>
        </svg>
      </button>
      <button class="control-btn" id="fullscreen-toggle" title="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const video = document.getElementById('video');
      const soundToggle = document.getElementById('sound-toggle');
      const fullscreenToggle = document.getElementById('fullscreen-toggle');
      const soundIcon = document.getElementById('sound-icon');
      const controls = document.querySelector('.controls');
      
      // Ensure video autoplays
      video.play().catch(e => console.log('Autoplay prevented:', e));
      
      // Handle visibility change
      let wasMuted = video.muted;
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          wasMuted = video.muted;
          video.muted = true;
          updateSoundIcon(true);
        } else if (!wasMuted) {
          video.muted = false;
          updateSoundIcon(false);
        }
      });

      // Handle window focus
      window.addEventListener('blur', () => {
        wasMuted = video.muted;
        video.muted = true;
        updateSoundIcon(true);
      });
      
      window.addEventListener('focus', () => {
        if (!wasMuted) {
          video.muted = false;
          updateSoundIcon(false);
        }
      });

      // Update sound icon based on mute state
      function updateSoundIcon(muted) {
        if (muted) {
          soundIcon.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3z');
          document.getElementById('mute-x').style.display = 'block';
          soundToggle.style.backgroundColor = 'rgba(255, 0, 0, 0.5)';
        } else {
          soundIcon.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z');
          document.getElementById('mute-x').style.display = 'none';
          soundToggle.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
        }
      }

      // Sound toggle
      soundToggle.addEventListener('click', () => {
        video.muted = !video.muted;
        updateSoundIcon(video.muted);
      });

      // Fullscreen toggle
      fullscreenToggle.addEventListener('click', () => {
        const container = document.querySelector('.scene-container');
        if (!document.fullscreenElement) {
          container.requestFullscreen().catch(err => {
            console.log('Error attempting to enable fullscreen:', err);
          });
        } else {
          document.exitFullscreen();
        }
      });

      // Hide controls when mouse is idle
      let timeout;
      document.addEventListener('mousemove', () => {
        controls.style.opacity = '1';
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          if (!video.paused) {
            controls.style.opacity = '0';
          }
        }, 2000);
      });
    });
  </script>
</body>
</html>
